project_id = "everlast"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 200

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = true
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[studio]
enabled = true
port = 54323

# Local mail catcher (Mailpit). Nothing sent while developing ever reaches a
# real inbox — confirmation and invite mails are captured and readable at
# http://127.0.0.1:54324. To skip confirmation entirely while developing, set
# `enable_confirmations = false` under [auth.email] below and `supabase stop &&
# supabase start`. Leave it ON for anything deployed.
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m"
otp_length = 8
otp_expiry = 900

[auth.email.template.invite]
subject = "You have been invited to a notebook on Everlast"

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.sessions]
timebox = "24h"
inactivity_timeout = "8h"

[auth.rate_limit]
email_sent = 10
sign_in_sign_ups = 30
token_refresh = 150
otp = 30

[analytics]
enabled = false
