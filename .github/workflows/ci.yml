name: CI

on:
  pull_request:
  workflow_call: # so deploy.yml can require this before shipping

# Deliberately no `push: [main]` trigger. deploy.yml runs on every push to main
# and calls this workflow as its `verify` job, which is not path-filtered — so
# main is covered either way. Running here as well put two claimants on the
# concurrency group below, and GitHub killed one of them every time:
#
#   Canceling since a higher priority waiting request for
#   ci-refs/heads/main exists
#
# Eight consecutive pushes to main were cancelled that way. The work still ran
# inside Deploy, so every commit had passing checks *and* a red CI run next to
# it — which is worth more confusion than a duplicated build is worth.

concurrency:
  group: ci-${{ github.ref }}
  # A newer commit on a pull request makes an in-flight run irrelevant, so
  # cancel it. A push does not: on main this workflow runs as deploy.yml's
  # `verify`, and deploy.yml sets `cancel-in-progress: false` precisely so that
  # two deploys never race. Cancelling here would reach past that guard and
  # kill the verify step of a deploy that is already shipping.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Contracts must exist as compiled output before the apps typecheck
      # against it — they consume `dist`, not the source.
      - name: Build contracts
        run: pnpm --filter @everlast/contracts build

      # Catches an ESM-only dependency reaching the CommonJS API build. It
      # passes locally either way — Node allows require() of ESM — and then
      # throws ERR_REQUIRE_ESM on every request in production.
      - name: Check for ESM-only dependencies
        run: pnpm check:esm

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          # Build-time only. `NEXT_PUBLIC_*` values are inlined into the client
          # bundle, so this must be a real value at build time — but CI only
          # needs the build to *succeed*, and the deployed bundles are rebuilt
          # by Vercel with the project's own environment.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-for-build-only
          NEXT_PUBLIC_API_URL: https://api.everlastlm.com

  # The smoke suite needs a live Postgres + Auth + Storage stack and real
  # provider keys, so it is not run here. Run it against a preview or staging
  # deployment: `API_URL=https://… node scripts/smoke.mjs`.
